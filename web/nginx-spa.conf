# nginx config INSIDE the web container. Serves the built SPA only — no TLS, no
# API proxying, no server_name. The host nginx owns all of that.

server {
    listen 80;
    server_name _;   # safe here: this nginx serves exactly one site, in its own
                     # container. Never do this in the HOST config, where 41 sites
                     # share one nginx.

    root /usr/share/nginx/html;
    index index.html;

    # Every non-file route belongs to React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so assets are safe to pin forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is the only file whose name does not
    # change between releases, so a cached copy pins the browser to an asset
    # bundle that the next deploy deletes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
