<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudFuze AI Migrations</title>
    <!--
      The official "Logo icon" from the CloudFuze Brand Guidelines, page 9 -- the
      full fuze mark (speed lines, discs, cloud), which is what the guidelines name
      as the icon. Not the cloud alone: that was a crop of our own invention, and it
      is not the brand's icon.
      Extracted as VECTOR from the PDF (the art is drawings, not an embedded raster),
      bbox 181.58,358.24 -> 364.06,450.71 on that page. assets/cloudfuze-icon.svg is
      the vector; the PNGs here are rasterised from it at 12x and keyed on the
      guidelines' #f6f6f6 tile so only the mark survives.
      The mark is 2.31:1, so in a square tab icon it is about half the height --
      that is the official icon's own shape, not a cropping choice.
      Transparent, so it sits on a light or dark tab strip without a white tile.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
