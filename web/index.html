<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudFuze AI Migrations</title>
    <!--
      The CLOUD from the CloudFuze lockup, not the whole lockup. The full mark is
      220x96 (2.29:1, the same ratio as assets/logo.png), which at a tab's real 16px
      height renders about seven pixels tall and reads as a smudge. The cloud alone
      is 84x71, so it survives the downscale and is still unmistakably ours.
      Cut at x=309 of assets/CloudFuze blue.png, the 8px pinch where the last speed
      disc meets the cloud -- crop anywhere left of it and a crescent of the disc
      rides along looking like an artefact.
      Transparent, so it sits on a light or dark tab strip without a white tile.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
