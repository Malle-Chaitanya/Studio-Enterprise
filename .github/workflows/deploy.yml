name: Deploy

# `business` is the trigger branch because it is the only one that has this file:
# main has never received it. A main-only trigger therefore fires never, and
# `workflow_dispatch` does not rescue that — GitHub offers Run workflow only for a
# workflow present on the DEFAULT branch, which is why `gh workflow list` returns CI
# alone. Drop `business` here once it merges to main.
on:
  push:
    branches: [main, business]
  workflow_dispatch:

# Never let two deploys race onto the same host.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR paths must be lowercase; the repo owner is mixed-case, so these are
  # written out rather than derived from github.repository.
  API_IMAGE: ghcr.io/malle-chaitanya/studio-enterprise-api
  WEB_IMAGE: ghcr.io/malle-chaitanya/studio-enterprise-web
  # Everything on the host lives here, matching the /data/<project>/ convention
  # the other projects on that box use.
  DEPLOY_DIR: /data/studio-ent

jobs:
  # ---------------------------------------------------------------------------
  # Gate first. Building and publishing an image that fails typecheck or tests
  # just puts a broken artifact in the registry with a real tag.
  # ---------------------------------------------------------------------------
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
        env:
          # config.ts Zod-parses process.env at import time and process.exit(1)s on a
          # missing value, which kills every suite that transitively imports logger or
          # db/core before its first assertion. These are placeholders, never used to
          # reach a real service.
          MS_CLIENT_ID: ci-placeholder
          MS_CLIENT_SECRET: ci-placeholder
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder

      - name: Web
        working-directory: web
        run: |
          npm ci
          npm run typecheck

  # ---------------------------------------------------------------------------
  # Build both images and push them tagged with the commit SHA.
  # ---------------------------------------------------------------------------
  build:
    name: build + push images
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the SHA as well as `latest` so a rollback is
      # `TAG=<old-sha> docker compose up -d` — no rebuild, no guessing which
      # `latest` was live at the time.
      - name: Build + push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------------
  # Pull the new images on the host and restart. No build, no npm, no rsync of
  # application code, and no sudo — `laxman` is in the docker group.
  # ---------------------------------------------------------------------------
  deploy:
    name: pull + up on host
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      # Needed for the streaming fallback below: the runner pulls the images itself
      # and pipes them to the host.
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The private key never touches the repo; it comes from DEPLOY_SSH_KEY.
      # known_hosts is pinned rather than ssh-keyscan'd at run time so a hijacked
      # DNS/IP cannot silently receive the deploy.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            # Secret OR variable. A port is not sensitive, so a variable is its natural
            # home — but reading ONLY vars meant a port added as a secret (beside the
            # other four DEPLOY_* values) resolved to empty and fell back to 22, failing
            # at connect with a timeout that says nothing about the real cause.
            Port ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || 22 }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity
        run: ssh deploy-target 'echo connected as $(whoami) on $(hostname)'

      # The compose file is the only thing copied to the host. Application code
      # arrives as images.
      #
      # mkdir first: scp into a missing directory fails with a bare
      # "No such file or directory" that names the file, not the directory, and
      # reads like the repo is missing the compose file.
      - name: Ship compose file
        run: |
          ssh deploy-target "mkdir -p ${DEPLOY_DIR}"
          scp deploy/docker-compose.yml deploy-target:${DEPLOY_DIR}/docker-compose.yml

      # The host nginx config rides along but is NOT installed: /etc/nginx is root's,
      # and the deploy holds no sudo on a box fronting 41 other sites. Putting the
      # current version on the host means installing it is two root commands with no
      # git checkout and no copy-paste, and that whoever does it is looking at the
      # version that matches the running containers.
      #
      #   sudo cp /data/studio-ent/nginx-csge.conf /etc/nginx/sites-available/csge
      #   sudo ln -sf /etc/nginx/sites-available/csge /etc/nginx/sites-enabled/csge
      #   sudo nginx -t && sudo systemctl reload nginx
      #
      # certbot rewrites sites-available/csge in place to add TLS, so re-copying this
      # file after certbot has run would DELETE the 443 block. Only copy it again if
      # the routing itself changed, and re-run certbot afterwards.
      - name: Ship host nginx config (not installed — root does that once)
        run: scp deploy/nginx-csge.conf deploy-target:${DEPLOY_DIR}/nginx-csge.conf

      # Preflight, before anything is torn down. Each of these has already bitten
      # this deploy once, and each fails in a way that looks like something else.
      - name: Preflight host prerequisites
        run: |
          ssh deploy-target "set -e
            cd ${DEPLOY_DIR}
            test -f .env                  || { echo '::error::${DEPLOY_DIR}/.env is missing'; exit 1; }
            test -f service_account.json  || { echo '::error::${DEPLOY_DIR}/service_account.json is missing. adk_deploy.py needs the key as a FILE (it never reads GOOGLE_SA_KEY_JSON), so without it Node authenticates fine and every Agent Engine deploy fails.'; exit 1; }
            docker compose version >/dev/null || { echo '::error::docker compose unavailable to this user'; exit 1; }
          "

      # Preferred path: the host pulls from GHCR itself. Allowed to fail rather than
      # aborting the deploy, because this host sits behind a proxy that its git cannot
      # get through at all (`Proxy CONNECT aborted` on a plain github.com clone), so
      # registry egress is not something to assume. The fallback below covers it.
      - name: Pull images on host
        id: hostpull
        continue-on-error: true
        run: |
          ssh deploy-target "set -e
            cd ${DEPLOY_DIR}
            TAG=${{ github.sha }} docker compose pull
          "

      # Fallback: the runner has GHCR access by definition, so it pulls both images and
      # streams them straight into the host's docker daemon. No registry credential on
      # the host, no package visibility to flip, nothing written to ~/.docker/config.json
      # on a box serving 41 other sites.
      #
      # gzip -1, not -9: these layers are already-compressed wheels and npm tarballs, so
      # the extra CPU buys almost nothing and the transfer is the bottleneck either way.
      - name: Stream images over SSH (fallback)
        if: steps.hostpull.outcome == 'failure'
        run: |
          echo "Host could not pull from GHCR — streaming images over SSH instead."
          docker pull ${API_IMAGE}:${{ github.sha }}
          docker pull ${WEB_IMAGE}:${{ github.sha }}
          # mongo:7.0 too. `docker compose pull` fetches all three services, so a failure
          # says nothing about which registry was unreachable — and if Docker Hub is the
          # blocked one, `up -d` would fail on a host that has never run this stack.
          # Sending it costs ~250MB once; the layers are then cached on the host.
          docker pull mongo:7.0
          docker save \
              ${API_IMAGE}:${{ github.sha }} \
              ${WEB_IMAGE}:${{ github.sha }} \
              mongo:7.0 \
            | gzip -1 \
            | ssh deploy-target 'gunzip | docker load'

      # Docker cannot allocate a network on this host any more:
      #
      #   failed to create network studio-ent_default: all predefined address pools
      #   have been fully subnetted
      #
      # 75 containers across ~17 projects have eaten the default pools. Rather than
      # restarting the daemon (root, and it bounces all 75 containers plus 41 nginx
      # sites), the stack brings its own subnet — and picks it here, against what is
      # actually allocated at this moment, instead of hardcoding a guess that goes
      # stale the next time another project adds a network.
      #
      # Reuses the subnet already recorded on the host when it is still free, so a
      # redeploy does not renumber a running stack for no reason.
      - name: Choose a free subnet
        id: subnet
        run: |
          SUBNET=$(ssh deploy-target "python3 - <<'PY'
          import ipaddress, json, subprocess

          ids = subprocess.run(['docker','network','ls','-q'],
                               capture_output=True, text=True).stdout.split()
          used = []
          if ids:
              raw = subprocess.run(['docker','network','inspect',*ids],
                                   capture_output=True, text=True).stdout
              for net in json.loads(raw or '[]'):
                  for cfg in (net.get('IPAM') or {}).get('Config') or []:
                      if cfg.get('Subnet'):
                          used.append(ipaddress.ip_network(cfg['Subnet'], strict=False))

          # Read back what this stack used last time; keeping it avoids renumbering.
          try:
              previous = open('/data/studio-ent/.subnet').read().strip()
          except OSError:
              previous = ''

          def free(candidate):
              net = ipaddress.ip_network(candidate)
              return not any(net.overlaps(u) for u in used)

          # 10.201.x is deliberate: Docker's own defaults live in 172.16/12 and
          # 192.168/16, so staying out of both avoids racing whatever the daemon
          # hands the other 16 projects next.
          choice = previous if previous and free(previous) else next(
              (c for c in (f'10.201.{i}.0/24' for i in range(40, 96)) if free(c)), '')
          if not choice:
              raise SystemExit('no free /24 in 10.201.40-95')
          open('/data/studio-ent/.subnet','w').write(choice + chr(10))
          print(choice)
          PY
          ")
          echo "Using subnet: $SUBNET"
          echo "subnet=$SUBNET" >> "$GITHUB_OUTPUT"

      # --no-build matters: the compose file also carries `build:` blocks for the
      # host-build path, and their context (./src) does not exist here. Without it a
      # missing image turns into a confusing "path not found" instead of a clear failure.
      - name: Restart stack
        run: |
          ssh deploy-target "set -e
            cd ${DEPLOY_DIR}
            export TAG=${{ github.sha }}
            export CSGE_SUBNET=${{ steps.subnet.outputs.subnet }}
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
          "

      # Two smoke tests, because they fail for different reasons and one combined
      # check hides which broke.
      #
      # 1. The API on its own port — proves the container is up and configured.
      # 2. The same endpoint through the host nginx, with an explicit Host header.
      #    That header is mandatory: a bare-IP request on a 41-site nginx lands on
      #    whichever block wins the default_server race, so the test could pass
      #    while our site is entirely broken.
      - name: Smoke test API directly
        run: |
          ssh deploy-target 'for i in $(seq 1 20); do
            curl -fsS --max-time 5 http://127.0.0.1:8083/api/health && exit 0
            sleep 3
          done
          echo "API never became healthy"; cd '"${DEPLOY_DIR}"'; docker compose logs --tail 80 api; exit 1' | tee health-direct.json
          grep -q '"status"' health-direct.json

      - name: Smoke test SPA + API through nginx
        run: |
          ssh deploy-target 'curl -fsS --max-time 15 -H "Host: studioent.cftools.live" http://127.0.0.1/api/health' | tee health-nginx.json
          grep -q '"status"' health-nginx.json
          ssh deploy-target 'curl -fsS --max-time 15 -o /dev/null -w "%{http_code}" -H "Host: studioent.cftools.live" http://127.0.0.1/' | tee spa-code.txt
          grep -q '200' spa-code.txt

      - name: Report running state
        if: always()
        run: ssh deploy-target "cd ${DEPLOY_DIR} && docker compose ps"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
