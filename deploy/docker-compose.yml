# CloudFuze Studio Migrate — production stack.
#
# Lives on the host at /data/studio-ent/docker-compose.yml, matching the
# /data/<project>/ convention the other ~17 projects on that box already use.
# Deploy is `docker compose pull && docker compose up -d` — no systemd unit, and
# no sudo, because `laxman` is in the docker group.
#
#   docker compose ps          what is running
#   docker compose logs -f api tail the API
#   docker compose pull && docker compose up -d   deploy
#
# TAG is set by the deploy workflow to the commit SHA so a rollback is
# `TAG=<old-sha> docker compose up -d`, not a rebuild.

name: studio-ent

services:
  # ---------------------------------------------------------------------------
  # MongoDB — ours, and only ours.
  #
  # No `ports:` on purpose. CS_GE's local convention is 27019, but on this host
  # 27019 already belongs to `agents-mongo`, an unrelated project. Pointing at it
  # would put the csge database inside another team's instance: shared backups,
  # shared restarts, shared blast radius. Reachable from the api container over
  # the compose network as mongodb://mongo:27017 and from nowhere else.
  # To inspect it: docker compose exec mongo mongosh
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - csge-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/malle-chaitanya/studio-enterprise-api:${TAG:-latest}

    # Build from the checkout at ./src, so `docker compose up -d --build` on the
    # host is a complete deploy with no registry involved. The `image:` line above
    # stays: with both present, compose builds and TAGS the result with that name,
    # so a later `docker compose pull` path still lines up. SRC defaults to ./src
    # and can point anywhere the repo is checked out.
    #
    # The context is the REPO ROOT, not server/ — every COPY in the Dockerfile is
    # repo-relative (it needs server/package.json AND server/scripts).
    build:
      context: ${SRC:-./src}
      dockerfile: server/Dockerfile

    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

    # Secrets only. Everything about *where this is deployed* is set in
    # `environment:` below instead, which compose applies with higher precedence
    # than env_file.
    #
    # That precedence is load-bearing, not incidental: the host .env currently
    # declares MS_REDIRECT_URI and GOOGLE_REDIRECT_URI TWICE, and the later
    # localhost:8080 pair silently wins under last-wins parsing. Setting them here
    # makes the correct values authoritative no matter what the file says. The
    # duplicates should still be deleted — this stops them mattering, it does not
    # make the file correct.
    env_file:
      - .env

    environment:
      # 8080 is already bound on this host by the ats-app container.
      PORT: 8083

      # The compose-network name, NOT localhost:27019 (see the mongo service).
      MONGO_HOST: mongodb://mongo:27017
      CSGE_DB: csge

      WEB_ORIGIN: https://studioent.cftools.live
      PUBLIC_BASE_URL: https://studioent.cftools.live
      MS_REDIRECT_URI: https://studioent.cftools.live/callback/microsoft
      GOOGLE_REDIRECT_URI: https://studioent.cftools.live/callback/google

      # adk_deploy.py:565 reads GOOGLE_APPLICATION_CREDENTIALS or GOOGLE_SA_KEY_FILE
      # and expects a PATH. It never reads GOOGLE_SA_KEY_JSON — that form only works
      # for the Node half (auth/google.ts:16). Without a real file on disk, Node
      # authenticates fine and every Agent Engine deployment fails, which is the
      # worst shape of failure: the app looks healthy.
      GOOGLE_SA_KEY_FILE: /run/secrets/service_account.json
      PYTHON_BIN: python3

    volumes:
      # Mount the key read-only. It is NOT baked into the image — the image is
      # published to GHCR and the repo is public.
      - /data/studio-ent/service_account.json:/run/secrets/service_account.json:ro

    # Read access to that key, without making it world-readable.
    #
    # A bind mount carries the HOST's uid/gid and mode through unchanged. The key is
    # owned by laxman (1005) at mode 600, and the container drops to csge (uid 10001)
    # — so the container is not the owner, 600 means owner-only, and every read of the
    # key failed with:
    #
    #   EACCES: permission denied, open '/run/secrets/service_account.json'
    #
    # Surfaced as "Google Workspace directory couldn't be read", whose own hint blames
    # Domain-Wide Delegation scopes — sending the reader to the Workspace admin console
    # to fix a file permission.
    #
    # The fix is a supplementary group, paired with `chmod 640` on the host file:
    # owner laxman keeps rw (they edit it), group gets r, others get NOTHING. Making it
    # 644 would also work and is wrong — this box runs 41 other sites, and the key
    # unlocks domain-wide delegation over the customer's Workspace.
    #
    # Alternatives rejected: `user: "1005:1005"` runs as a uid with no /etc/passwd
    # entry, which breaks any library calling getpwuid()/expanduser(); chown'ing the key
    # to 10001 locks out the human who maintains it.
    #
    # 1005 is laxman's gid on THIS host (`id -g`). Override per host if it differs.
    group_add:
      - "${SECRET_GID:-1005}"

    # Bound to loopback: the host nginx is the only thing that may reach it.
    ports:
      - "127.0.0.1:8083:8083"

  # ---------------------------------------------------------------------------
  # SPA
  # ---------------------------------------------------------------------------
  web:
    image: ghcr.io/malle-chaitanya/studio-enterprise-web:${TAG:-latest}
    build:
      context: ${SRC:-./src}
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"

volumes:
  csge-mongo-data:

# -----------------------------------------------------------------------------
# The default network, with its subnet pinned.
#
# Letting Docker allocate one failed outright on this host:
#
#   failed to create network studio-ent_default: all predefined address pools
#   have been fully subnetted
#
# 75 containers across ~17 projects have consumed Docker's default pools
# (172.17.0.0/12 carved into /16s, plus 192.168.0.0/16). The alternative fix is
# extending `default-address-pools` in /etc/docker/daemon.json, which needs root
# AND `systemctl restart docker` — bouncing all 75 containers and 41 sites on a
# shared box, to give one project a network. Pinning our own subnet touches
# nothing outside this project.
#
# The deploy workflow picks a free /24 at run time and passes it as CSGE_SUBNET,
# so this default only applies to a by-hand `docker compose up`. If that collides,
# run: CSGE_SUBNET=10.201.44.0/24 docker compose up -d
# -----------------------------------------------------------------------------
networks:
  default:
    ipam:
      config:
        - subnet: ${CSGE_SUBNET:-10.201.42.0/24}
