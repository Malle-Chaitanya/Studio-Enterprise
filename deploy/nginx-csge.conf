# Install on the host as /etc/nginx/sites-available/csge (symlink into sites-enabled).
#
# server_name is studioent.cftools.live (A record verified -> 208.70.248.68 on 2026-08-13).
# Never use `server_name _` here: this nginx already serves aicommunication.cftools.live,
# aitoolsmigration and ats.cftools.live, and the catch-all would hijack their unmatched
# traffic.
#
# This file is the pre-certbot (port 80) form. `certbot --nginx -d studioent.cftools.live`
# rewrites it in place to add the 443 server block and the http->https redirect; do not
# hand-write TLS here and then re-run certbot over it.
#
# Always `sudo nginx -t` before reloading: a bad config here takes the other sites down
# with it.

server {
    listen 80;
    server_name studioent.cftools.live;

    root /data/studio-ent/web;
    index index.html;

    # SPA: every non-file route is handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable; index.html must never be cached or a deploy
    # leaves browsers pinned to a dead asset bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The OAuth callbacks are NOT under /api/. server.ts mounts legacyAuthRouter at '/',
    # so /callback/microsoft and /callback/google live at the root — which is exactly
    # where the SPA's try_files catch-all would answer with index.html instead, and both
    # sign-ins would end on a blank page with the auth code silently discarded. These are
    # the redirect URIs registered in the Azure and Google apps, so they must proxy.
    location /callback/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Migration progress is streamed as SSE — buffering would hold every event
        # until the run finished, and the default 60s read timeout would kill the stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    client_max_body_size 4m;
}
