# Install on the HOST as /etc/nginx/sites-available/csge (symlink into sites-enabled).
#
# This is the only piece that is not containerized, because it is shared: one nginx
# fronts all ~41 sites on this box. It terminates TLS and routes studioent.cftools.live
# to two containers:
#
#   /            -> 127.0.0.1:8084   web container (nginx serving the built SPA)
#   /api/        -> 127.0.0.1:8083   api container
#   /callback/   -> 127.0.0.1:8083   api container
#
# server_name is studioent.cftools.live (A record verified -> 208.70.248.68 on 2026-08-13).
# Never `server_name _` here: 41 sites share this nginx and the catch-all would hijack
# every one of their unmatched requests. (`server_name _` IS used inside the web
# container, where exactly one site exists — see web/nginx-spa.conf.)
#
# The API is on 8083, not the config.ts default of 8080: 8080 on this host is already
# bound by the ats-app container.
#
# This file is the pre-certbot (port 80) form. `certbot --nginx -d studioent.cftools.live`
# rewrites it in place to add the 443 server block and the http->https redirect; do not
# hand-write TLS here and then re-run certbot over it.
#
# Always `sudo nginx -t` before reloading: a bad config here takes the other 41 sites
# down with it.

server {
    listen 80;
    server_name studioent.cftools.live;

    # No `root` and no `try_files`. The SPA is served by the web container, which owns
    # its own cache policy (immutable /assets/, no-store index.html) so that policy
    # ships and is reviewed with the code it applies to.
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The OAuth callbacks are NOT under /api/. server.ts:56 mounts legacyAuthRouter at
    # '/', so /callback/microsoft and /callback/google live at the root — which is where
    # the SPA would otherwise answer with index.html, ending both sign-ins on a blank
    # page with the auth code silently discarded and nothing in the logs, because the
    # request never reached Express. These are the redirect URIs registered in the Azure
    # and Google apps, so they must reach the API.
    location /callback/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Migration progress is streamed as SSE — buffering would hold every event
        # until the run finished, and the default 60s read timeout would kill the
        # stream mid-migration.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Matches express.json({ limit: '2mb' }) with headroom. Do not raise to work around
    # a large payload — the limit is deliberate.
    client_max_body_size 4m;
}
