# Install on the host as /etc/nginx/sites-available/csge (symlink into sites-enabled).
# Replace csge.example.com with the real host name before enabling TLS via certbot.

server {
    listen 80;
    server_name csge.example.com;

    root /var/www/csge;
    index index.html;

    # SPA: every non-file route is handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable; index.html must never be cached or a deploy
    # leaves browsers pinned to a dead asset bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Migration progress is streamed as SSE — buffering would hold every event
        # until the run finished, and the default 60s read timeout would kill the stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    client_max_body_size 4m;
}
